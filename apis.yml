name: SATIM
description: >-
  SATIM provides AI-powered analysis of Synthetic Aperture Radar (SAR) imagery for
  intelligence, surveillance, and reconnaissance (ISR) operations. Its OREC analytics
  engine performs automated object detection and classification on satellite and
  airborne SAR data (accuracy up to 95%), deployable in cloud, edge, or air-gapped
  environments and integrable into C2 and C4ISR workflows. OREC-Intelligence adds
  persistent monitoring with real-time area-of-interest change alerts and activity
  pattern analysis. Headquartered in Krakow, Poland, with offices in Dover, Delaware
  and London. Surfaced as a Techstars portfolio company; no public API surface,
  developer portal, SDKs, or documentation are published at this time.
